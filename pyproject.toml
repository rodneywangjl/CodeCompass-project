[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codecompass"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
codecompass = "codecompass.online.tui:main"

[tool.setuptools.packages.find]
include = ["codecompass*"]

[tool.pytest.ini_options]
markers = [
    "model: tests requiring a real local model (excluded from the required suite)",
]
strict_markers = true
