name: ci

on: [push, pull_request]

jobs:
  test:
    # The constitution requires Linux, Windows and macOS (Article VIII.2). The required
    # suite is model-free, so this proves the Python code, not GPU speed (Spec 005 AC-4.6).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git config --global user.email "ci@codecompass.test" && git config --global user.name "codecompass-ci"
      - run: pip install -r requirements.txt
      - run: pytest -m "not model"
